title: I Speak Jesus
artist: Charity Gayle
key: D
bpm: 74
length: "6:00"
note: "Steph: once we drop to the low V1 near the end, it stays down – do NOT build back up."

sections:
  - name: Intro
    level: 0
    cue: OUT
    detail: Keys / pad only.
  - name: V1
    level: 1
    cue: Kick 1, rims 3
    detail: Light – kick 1, rims on 3. Stay out of the way.
  - name: V2
    level: 2
    cue: Add hats, kick 1 · 3
    detail: Add hats 8ths, kick 1 · 3.
  - name: Chorus
    level: 3
    cue: Backbeat, crash on 1
    detail: First real groove.
  - name: V3
    level: 2
    cue: ↓ pull back
    detail: Back down, keep the pulse.
  - name: Chorus
    x: 2
    level: 4
    cue: ↑ ride p2
    detail: Lift – ride on p2.
  - name: Bridge
    x: 2
    level: 4>5
    cue: Toms p1, full p2
    detail: "'Shout Jesus' – tom build on p1, all in on p2."
  - name: Chorus
    x: 2
    level: 5
    cue: Peak
  - name: Low V1
    level: 1
    cue: DROP – stay down
    detail: "Steph: once we come down here, it stays down through the end. Do NOT build back up."
    hot: true
  - name: Interlude
    x: 2
    level: 1
    cue: Stay low
    detail: No lift here.
  - name: Bridge
    x: 3
    level: 1
    cue: Stay low – no build
    detail: Hold back even as the bridge repeats.
    hot: true
  - name: End
    level: 0
    cue: OUT
    detail: Stay down.

variants:
  reprise:
    length: "3:00"
    note: "Steph: 2× big bridges, then 2× big chorus, end big on the 1."
    sections:
      - name: Bridge
        x: 2
        level: 5
        cue: BIG from the top
        detail: "'Shout Jesus'. No build-in – both passes full."
        hot: true
      - name: Chorus
        x: 2
        level: 5
        cue: Ride, crashes
        detail: Keep it up both passes.
      - name: End
        level: 5
        cue: HIT 1
        detail: End big on the 1.
        hot: true
