title: Worthy of It All
artist: CeCe Winans
key: D
bpm: 71
note: "Triplet kick is the signature – offbeat in V2, under the rims in Bridge 1. Adam: no vamp after the bridges – straight build on Bridge 2 pass 2, fill out to the chorus."

sections:
  - name: Intro · V1
    level: 0
    cue: "Drums out"
  - name: Chorus
    level: 1
    cue: "Swell in, light ride optional"
    detail: "Cymbal swell in. Light ride if it feels right, otherwise stay out. No kick or snare."
  - name: Turn
    level: 0
    cue: "Drums out"
    detail: "Get set for V2."
  - name: V2
    level: 2
    cue: "Offbeat triplet kick, hats"
    detail: "Real entry. Offbeat triplet kick under hats, offbeat kick and snare groove. Keep it light – the chorus is the lift."
    hot: true
  - name: Chorus
    x: 2
    level: 4
    cue: "Ride 16ths, 4 on floor"
    detail: "Ride 16ths, 4 on floor, backbeat."
  - name: Interlude
    x: 2
    level: 0
    cue: "Drums out"
    detail: "Ring off the last chorus hit and sit."
    hot: true
  - name: Bridge 1
    x: 2
    level: 1
    cue: "Ring in, triplet kick, rims"
    detail: "Cymbal ring in, then triplet kick with rims. Both passes. No snare."
  - name: Bridge 2 pass 1
    level: 3
    cue: "4 on floor, ride 8ths, toms"
    detail: "4 on floor, ride 8ths, toms and snare underneath."
  - name: Bridge 2 pass 2
    level: 4>5
    cue: "Straight build, fill to chorus"
    detail: "Straight 8th build on ride and snare, fill out to the chorus on the 1. No vamp."
    hot: true
  - name: Chorus
    x: 2
    level: 5
    cue: "Double kick, ride groove"
    detail: "Biggest point of the song."
  - name: End
    level: 5
    cue: "4 quarter hits, let ring"
    detail: "Four quarter notes, kick and crash together on each, then let the last one ring out."
    hot: true
