title: Praise
key: G
bpm: 127
note: "Josiah: no intro or outro chants. Mostly toms / floor tom and ride; hats only on the interlude."

sections:
  - name: Intro
    level: 3
    cue: "Swell, crash on 1"
    detail: "Cymbal and floor tom swell into a big crash on the 1. No chant – straight into the groove."
    hot: true
  - name: V1
    level: 1
    cue: "Light floor tom"
    detail: "Light floor tom beat – no snare, no cymbals. Pulled way back."
  - name: V2
    level: 1
    cue: "Same as V1"
  - name: Pre-Chorus
    level: 3
    cue: "Toms – build, fill to 1"
    detail: "Stay on the toms, build the tom groove, fill into the 1."
  - name: Chorus 1
    level: 4
    cue: "Toms, backbeat, 4 on floor"
    detail: "Toms, backbeat, 4 on floor, crash accents."
  - name: V3
    level: 1
    cue: "Light floor tom"
    detail: "Back down to the light floor tom beat, no snare."
  - name: V4
    level: 2
    cue: "Floor tom, add backbeat"
  - name: Pre-Chorus
    level: 3
    cue: "Build, fill into chorus"
  - name: Chorus 1
    level: 4
    cue: "Toms and snare, 4 on floor"
  - name: Chorus 2
    level: 4
    cue: "Push – bigger crashes"
  - name: Interlude
    x: 2
    level: 2
    cue: "Light hats 16ths"
    detail: "Light hats 16ths, simple kick. Ease back to set up the bridge."
  - name: Bridge 1
    level: 2
    cue: "Floor tom groove, light"
    detail: "Light and intimate."
  - name: Bridge 2
    level: 3
    cue: "Floor toms and snare, build"
  - name: Chorus 1
    x: 2
    level: 5
    cue: "Ride bell – the payoff"
    detail: "Wash on the ride bell, driving kick, backbeat."
    hot: true
  - name: Chorus 2
    x: 2
    level: 5
    cue: "Back to toms – huge"
    detail: "Stay huge, crash-heavy."
  - name: Instrumental
    x: 2
    level: 5
    cue: "Toms, big fills"
  - name: End
    level: 5
    cue: "Big hit on 4, then rumble"
    detail: "No outro chant. Land big on the 4, then a floor tom and cymbal rumble into the next song."
    hot: true

